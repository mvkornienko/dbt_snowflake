version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 7
              period: day
          loaded_at_field: _batched_at
        columns:
          - name: id
            data_type: number
          - name: orderid
            data_type: number
          - name: paymentmethod
            data_type: varchar
          - name: status
            data_type: varchar
          - name: amount
            data_type: number
          - name: created
            data_type: date
          - name: _batched_at
            data_type: timestamp_ntz
